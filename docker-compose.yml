services:

  db:
    image: mysql:8.0
    container_name: cloudeats-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cloudeats_db
      MYSQL_USER: cloudeats_user
      MYSQL_PASSWORD: cloudeats_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cloudeats-network

  redis:
    image: redis:7-alpine
    container_name: cloudeats-redis
    ports:
      - "6379:6379"
    networks:
      - cloudeats-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:4.4
    container_name: cloudeats-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - cloudeats-network
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10


  user-service:
    build: ./services/user-service
    container_name: cloudeats-user-service
    ports:
      - "3001:3001"
    environment:
      DB_HOST: db
      DB_USER: cloudeats_user
      DB_PASSWORD: cloudeats_password
      DB_NAME: cloudeats_db
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloudeats-network

  menu-service:
    build: ./services/menu-service
    ports:
      - "3010-3019:3002"
    environment:
      DB_HOST: db
      DB_USER: cloudeats_user
      DB_PASSWORD: cloudeats_password
      DB_NAME: cloudeats_db
      PORT: 3002
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloudeats-network


  order-service:
    build: ./services/order-service
    container_name: cloudeats-order-service
    ports:
      - "3003:3003"
    environment:
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      PORT: 3003
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudeats-network

  api-gateway:
    build: ./services/api-gateway
    container_name: cloudeats-api-gateway
    ports:
      - "8000:8000"
    environment:
      USER_SERVICE_URL:  http://user-service:3001
      MENU_SERVICE_URL:  http://menu-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      PORT: 8000
    depends_on:
      - user-service
      - menu-service
      - order-service
    networks:
      - cloudeats-network
    restart: unless-stopped


volumes:
  mysql-data:
  mongo-data:

networks:
  cloudeats-network:
    driver: bridge
